name: Build and Tests

on:
  push:
  pull_request:

jobs:
  get_scala_versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: tpunder/cross-scala-versions@master
        id: run
    outputs:
      sbt_versions: ${{ steps.run.outputs.sbt_versions }}

  # Compiles the plugin across the SBT/Java matrix. There is no test suite: the tests this
  # project used to have all required a live S3 (real AWS or LocalStack) and were dropped.
  build:
    needs: get_scala_versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        #os: [ 'ubuntu-latest', 'macos-latest', 'windows-latest' ]
        os: [ 'ubuntu-latest' ]
        java: [ '8', '11', '17' ]
        sbt: ${{ fromJson(needs.get_scala_versions.outputs.sbt_versions) }}
    name: Build/Test - SBT ${{ matrix.sbt }}, Java ${{ matrix.Java }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v2
      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - run: sbt ^^${{ matrix.sbt }} test
