name: Build and Tests

on:
  push:
  pull_request:

jobs:
  # Compiles the plugin across the Java matrix. There is no test suite: the tests this
  # project used to have all required a live S3 (real AWS or LocalStack) and were dropped.
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        #os: [ 'ubuntu-latest', 'macos-latest', 'windows-latest' ]
        os: [ 'ubuntu-latest' ]
        java: [ '17', '21' ]
    name: Build - Java ${{ matrix.java }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - run: sbt test
